name: example
description: "Working example of antsf_flutter_starter's route-guard + Riverpod wiring."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  antsf_flutter_starter:
    path: ../
  go_router: ^16.2.5
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  riverpod_generator: ^3.0.0
  go_router_builder: "4.1.1"

flutter:
  uses-material-design: true
