name: example
description: "Working example of antsf_flutter_starter's route-guard + Riverpod wiring."
publish_to: "none"
version: 0.2.1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  antsf_flutter_starter:
    path: ../
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  go_router_builder: ^4.1.1

flutter:
  uses-material-design: true
